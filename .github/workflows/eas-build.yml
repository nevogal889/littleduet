# Builds the iPhone/iPad and Android apps on Expo's cloud (EAS).
# One-time setup: create an Expo access token (expo.dev > Account settings > Access tokens)
# and add it to this repo as the secret EXPO_TOKEN (Settings > Secrets and variables > Actions).
# Then run: Actions > EAS build > Run workflow, and pick a profile.
name: EAS build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile from app/eas.json"
        type: choice
        options: [preview, production, development]
        default: preview
      platform:
        description: "Platform"
        type: choice
        options: [all, ios, android]
        default: all

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "Add the EXPO_TOKEN secret first (see the comment at the top of this file)."; exit 1; fi
      - run: npm install --no-audit --no-fund
      - run: node scripts/sync-content.mjs
      - name: Start the cloud build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_VIDEO_BASE_URL: ${{ vars.EXPO_PUBLIC_VIDEO_BASE_URL }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx eas-cli@latest build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
