# Runs on every push and pull request: validates the song catalog and lessons,
# installs the app for real, type-checks it, runs the unit tests and builds the web export.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  content:
    name: Songs and lessons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r video/requirements.txt
      - name: Validate the 100-song catalog
        run: cd content && python validate_songs.py
      - name: Rebuild and validate every lesson
        run: python content/build_lessons.py --songs content/songs.json
      - name: Lessons in git match the generator
        run: git diff --exit-code -- content/lessons || (echo "content/lessons is stale; run build_lessons.py and commit" && exit 1)

  app:
    name: App (install, types, tests, web export)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to post the full report as a commit comment
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Align Expo package versions
        run: npx expo install --check || true
      - name: Copy content into the app
        run: node scripts/sync-content.mjs
      - name: Type-check
        id: tsc
        run: npx tsc --noEmit 2>&1 | tee ../tsc.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Unit tests
        id: jest
        run: npx jest --ci 2>&1 | tee ../jest.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Web export
        id: export
        run: npx expo export -p web 2>&1 | tee ../export.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Post the full report on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## CI report"
            echo "Type-check: ${{ steps.tsc.outcome }} | Unit tests: ${{ steps.jest.outcome }} | Web export: ${{ steps.export.outcome }}"
            for f in tsc jest export; do
              echo; echo "### $f"; echo '```'
              if [ "$f" = jest ]; then grep -E "✕|●|Tests:|Test Suites:|FAIL" ../$f.txt | head -80; else tail -n 80 ../$f.txt; fi
              echo '```'
            done
          } > ../report.md
          head -c 60000 ../report.md > ../report-trim.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat ../report-trim.md)" > /dev/null
      - name: Fail if any step failed
        if: steps.tsc.outcome != 'success' || steps.jest.outcome != 'success' || steps.export.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: app/dist
          retention-days: 7
